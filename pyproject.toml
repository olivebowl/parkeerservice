[project]
name = "parkeerservice"
dynamic = ["version"]
description = "Home Assistant integration for the parkeerservice used in several cities in the Netherlands."
readme = "README.md"
license = "EUPL-1.2"
authors = [{ name = "olivebowl" }]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "aioresponses>=0.7.9",
    "freezegun>=1.5.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest-homeassistant-custom-component",
    "ruff>=0.8",
]

# Dev tooling only: the integration itself is not a distributable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no copyright headers
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ANN401", "SLF001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["custom_components", "tests"]
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=custom_components.parkeerservice --cov-report=term-missing --cov-fail-under=95"

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
